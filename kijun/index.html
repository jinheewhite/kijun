<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>디지털튜터 문제해결 매뉴얼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style id="css">
/* Layout: field clipboard — title scrolls away, search + category chips stay pinned, one column of fold-out cards */
:root {
  --paper: #EEF3F0;
  --card: #FFFFFF;
  --ink: #16211D;
  --muted: #56675F;
  --line: #D3DDD8;
  --chip: #E3EBE7;
  --memo: #F4F7F5;
  --accent: #1E6A55;
  --accent-ink: #FFFFFF;
  --mark: #FFE7A3;
  --c-board: #1E6A55;
  --c-laptop: #2D5B99;
  --c-cabinet: #9A5C14;
  --c-account: #67489B;
  --c-windows: #1C6E8A;
  --c-special: #8A4F7D;
  --c-etc: #56675F;
  --s-done: #23804F;
  --s-temp: #B06E12;
  --s-check: #B83A2E;
  --s-routine: #56675F;
  --s-info: #2D5B99;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101715; --card: #18211E; --ink: #E4EDE9; --muted: #98AAA2; --line: #2A3732;
    --chip: #23302B; --memo: #1D2824; --accent: #5DBE9C; --accent-ink: #0C1613; --mark: #6B5418;
    --c-board: #5DBE9C; --c-laptop: #84A9E6; --c-cabinet: #E0A55C; --c-account: #B79BE6; --c-windows: #6CC4E0; --c-special: #D99BC8; --c-etc: #98AAA2;
    --s-done: #5CC88E; --s-temp: #E5A84B; --s-check: #F07C70; --s-routine: #98AAA2; --s-info: #84A9E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101715; --card: #18211E; --ink: #E4EDE9; --muted: #98AAA2; --line: #2A3732;
  --chip: #23302B; --memo: #1D2824; --accent: #5DBE9C; --accent-ink: #0C1613; --mark: #6B5418;
  --c-board: #5DBE9C; --c-laptop: #84A9E6; --c-cabinet: #E0A55C; --c-account: #B79BE6; --c-windows: #6CC4E0; --c-special: #D99BC8; --c-etc: #98AAA2;
  --s-done: #5CC88E; --s-temp: #E5A84B; --s-check: #F07C70; --s-routine: #98AAA2; --s-info: #84A9E6;
  color-scheme: dark;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper);
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Title block */
.top .wrap { padding-block: 22px 6px; display: grid; gap: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0; }
.h1row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.notelink { text-decoration: none; justify-self: start; }
.ghset { justify-self: start; }
h1 {
  font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 8vw, 40px);
  line-height: 1.1; margin: 0; letter-spacing: -.01em; text-wrap: balance;
}
.lede { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 60ch; }

/* Pinned search bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.bar .wrap { padding-block: 10px; display: grid; gap: 10px; }
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 12px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
#q {
  width: 100%; box-sizing: border-box;
  font: 500 16px/1.2 var(--f-body); color: var(--ink);
  background: var(--card); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 12px 42px 12px 38px; appearance: none; -webkit-appearance: none;
}
#q::placeholder { color: var(--muted); font-weight: 400; }
#q:focus { outline: none; border-color: var(--accent); }
#q::-webkit-search-cancel-button { display: none; }
#clear {
  position: absolute; right: 6px; width: 32px; height: 32px; border: 0; border-radius: 8px;
  background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer;
}
#clear:focus-visible { outline: 2px solid var(--accent); }

.chips {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  margin: 0 -2px; padding: 2px; scroll-snap-type: x proximity;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; scroll-snap-align: start;
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 14px/1 var(--f-body); color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 13px; cursor: pointer; white-space: nowrap;
}
.chip .n { font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .n { color: var(--accent-ink); opacity: .8; }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* List */
main .wrap { padding-block: 14px 28px; display: grid; gap: 10px; }
.summary-line { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
.summary-line b { color: var(--ink); font-weight: 600; }

.entry {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0;
}
.entry > summary {
  list-style: none; cursor: pointer; padding: 14px 16px 14px;
  display: grid; gap: 6px; border-radius: 12px;
}
.entry > summary::-webkit-details-marker { display: none; }
.entry > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.cat {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; letter-spacing: .03em; color: var(--cc);
}
.cat::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cc); }
.status {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600; color: var(--sc);
  border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px;
}
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.date { font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
.chev { width: 16px; height: 16px; color: var(--muted); transition: transform .18s ease; }
.entry[open] .chev { transform: rotate(180deg); }
.symptom { font-size: 17px; font-weight: 600; line-height: 1.45; margin: 0; text-wrap: pretty; overflow-wrap: anywhere; }
.device { font-size: 13px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

.body {
  padding: 4px 16px 16px; display: grid; gap: 16px; min-width: 0;
}
.body::before { content: ""; display: block; border-top: 1px dashed var(--line); }
.sec { display: grid; gap: 8px; min-width: 0; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0; }
.prep { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.prep li { background: var(--chip); border-radius: 6px; padding: 4px 9px; font-size: 14px; }
.none { font-size: 14px; color: var(--muted); margin: 0; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; }
.steps li::before {
  content: counter(s);
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; margin-top: 1px;
  font: 500 12px/1 var(--f-mono); color: var(--accent-ink); background: var(--accent);
}
.steps li span { overflow-wrap: anywhere; }

.memo { list-style: none; margin: 0; padding: 10px 12px; background: var(--memo); border-radius: 8px; display: grid; gap: 6px; }
.memo li { position: relative; padding-left: 14px; font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
.memo li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 1.5px; background: var(--muted); }

.secret {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  font-size: 14px; padding: 9px 12px; border: 1px dashed var(--line); border-radius: 8px;
}
.secret svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.secret .tag { font-size: 12px; font-weight: 600; color: var(--card); background: var(--ink); border-radius: 4px; padding: 2px 7px; }

code {
  font: 500 13px/1.4 var(--f-mono); background: var(--chip); border-radius: 4px; padding: 1px 5px;
  overflow-wrap: anywhere;
}
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

.empty {
  background: var(--card); border: 1px dashed var(--line); border-radius: 12px;
  padding: 22px 16px; text-align: left; display: grid; gap: 4px;
}
.empty b { font-size: 15px; }
.empty span { font-size: 14px; color: var(--muted); }

footer .wrap { padding-block: 4px 32px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
footer p { margin: 0; }

.entry.imp { border: 1.5px solid var(--s-check); }
.imp-badge { font-size: 12px; font-weight: 600; color: var(--card); background: var(--s-check); border-radius: 4px; padding: 1px 7px; }
.keys {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin: 2px 0 0; padding: 10px 12px; background: var(--memo); border-radius: 8px;
}
.keys .cap { width: 100%; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.key {
  min-width: 36px; height: 36px; box-sizing: border-box; display: grid; place-items: center;
  border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card);
  font: 500 20px/1 var(--f-mono); box-shadow: 0 2px 0 var(--line);
}
.keys .sep { width: 10px; height: 1.5px; background: var(--muted); }

.contact {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  padding: 12px; border: 1.5px solid var(--accent); border-radius: 10px;
}
.contact .who { width: 100%; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.contact .num {
  font: 500 22px/1.2 var(--f-mono); font-variant-numeric: tabular-nums;
  user-select: all; -webkit-user-select: all;
}
.contact .ext { font-size: 15px; font-weight: 600; }
.copy {
  margin-left: auto; font: 600 13px/1 var(--f-body); color: var(--accent);
  background: transparent; border: 1px solid var(--accent); border-radius: 8px;
  padding: 9px 12px; cursor: pointer;
}
.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pwgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pwcol { display: grid; gap: 6px; align-content: start; min-width: 0; }
.pwyear { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--c-cabinet); }
.pw {
  display: flex; align-items: baseline; justify-content: space-between; gap: 4px;
  padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
}
.pw .cls { font-size: 12px; font-weight: 600; color: var(--muted); }
.pw .code { font: 500 17px/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.sheet { display: block; width: auto; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }

@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

/* Edit / delete */
.right { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.acts, .confirm { display: inline-flex; align-items: center; gap: 4px; }
.act {
  font: 600 12px/1 var(--f-body); color: var(--muted); background: var(--card);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer;
}
.act:hover { color: var(--ink); border-color: var(--muted); }
.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.act.del { color: var(--s-check); }
.confirm { font-size: 12px; font-weight: 600; color: var(--s-check); }
.act.yes { background: var(--s-check); border-color: var(--s-check); color: var(--card); }

.listhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
.listhead .summary-line { margin: 0; flex: 1 1 auto; }
.add {
  font: 600 13px/1 var(--f-body); color: var(--accent); background: transparent;
  border: 1px dashed var(--accent); border-radius: 8px; padding: 9px 12px; cursor: pointer;
}
.add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.editor {
  background: var(--card); border: 1.5px solid var(--accent); border-radius: 12px;
  padding: 16px; display: grid; gap: 12px; min-width: 0;
}
.ed-title { font-size: 16px; font-weight: 600; margin: 0; }
.editor label {
  display: grid; gap: 4px; min-width: 0;
  font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted);
}
.editor label small { font-weight: 400; letter-spacing: 0; }
.editor input[type="text"], .editor input[type="date"], .editor select, .editor textarea {
  width: 100%; box-sizing: border-box; min-width: 0;
  font: 400 16px/1.45 var(--f-body); letter-spacing: 0; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
}
.editor textarea { resize: vertical; }
.editor input:focus, .editor select:focus, .editor textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.row3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.editor .chk {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--ink);
}
.chk input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.ed-err { margin: 0; font-size: 14px; color: var(--s-check); }
.ed-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: 600 15px/1 var(--f-body); color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .6; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ed-note { margin: 0; font-size: 12px; color: var(--muted); }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500;
  padding: 10px 16px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
}

/* Tables (accounts, contacts) */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th {
  text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted);
  background: var(--memo); padding: 8px 10px; white-space: nowrap;
}
.tbl td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tbl td:first-child { font-weight: 600; min-width: 7.5em; }
.wired, .winold, .ezboard { font-weight: 700; }
.wired, .winold { color: var(--s-check); }
.ezboard { color: var(--s-info); }
.tbl tfoot td { background: var(--memo); white-space: nowrap; }
.tbl tfoot td:first-child { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.tbl tfoot tr.first td { border-top: 2px solid var(--line); }
.tbl tfoot .sub-name { font-weight: 600; }
.tbl tfoot tr.co td { border-top: 1px solid var(--line); }
.tbl tfoot tr.co.first td { border-top: 2px solid var(--line); }
.tbl tfoot tr.ver td { border-top: 0; padding-top: 2px; }
.tbl tfoot .ver-name { color: var(--muted); padding-left: 14px; position: relative; }
.tbl tfoot .ver-name::before { content: ""; position: absolute; left: 2px; top: .7em; width: 7px; height: 1.5px; background: var(--muted); }
.tbl tfoot .sub-n { font: 500 14px/1 var(--f-mono); font-variant-numeric: tabular-nums; margin-left: 10px; }
.tbl tfoot tr.total td { border-top: 1.5px solid var(--ink); background: var(--chip); }
.tbl tfoot tr.total td:first-child { color: var(--ink); font-size: 13px; }
.tacts { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Classroom board table: compact grid, header row + first column (교실명) frozen (view and edit) */
.tbl.grid { max-height: min(70vh, calc(100dvh - 170px)); overflow: auto; overscroll-behavior: contain; }
.tbl.grid table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl.grid th, .tbl.grid td { white-space: nowrap; padding: 6px 8px; }
.tbl.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--memo); box-shadow: inset 0 -1px 0 var(--line); }
.tbl.grid thead th:first-child, .tbl.grid tbody td:first-child { position: sticky; left: 0; box-shadow: inset -1px 0 0 var(--line); }
.tbl.grid thead th:first-child { z-index: 4; box-shadow: inset -1px 0 0 var(--line), inset 0 -1px 0 var(--line); }
.tbl.grid tbody td:first-child { z-index: 1; background: var(--card); min-width: 0; font-weight: 600; }
.tbl.grid tfoot td.flab { position: sticky; left: 0; z-index: 1; }
.act.xl { color: var(--accent); border-color: var(--accent); }
.act[disabled] { opacity: .6; cursor: default; }

/* Visible passwords */
.secret .slabel { flex: 1 1 10em; min-width: 0; overflow-wrap: anywhere; }
.pwval {
  font: 500 15px/1.3 var(--f-mono); letter-spacing: .02em; color: var(--ink);
  background: var(--chip); border-radius: 6px; padding: 4px 8px;
  user-select: all; -webkit-user-select: all; overflow-wrap: anywhere;
}
.secret .copy { margin-left: 0; padding: 7px 10px; }

/* Reorder mode */
.add.solid { background: var(--accent); color: var(--accent-ink); border-style: solid; }
.add[disabled] { opacity: .6; cursor: default; }
.orow {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.orow.imp { border-color: var(--s-check); }
.onum { flex: none; width: 1.6em; text-align: right; font: 500 13px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.otext { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.otitle { font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.obtns { flex: none; display: inline-flex; gap: 4px; }
.obtns .act { font-size: 16px; min-width: 40px; min-height: 40px; padding: 0; color: var(--ink); }
.act[disabled] { opacity: .3; cursor: default; }

/* Download links */
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.links li { display: grid; gap: 3px; }
.links a {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 12px; border: 1.5px solid var(--accent); border-radius: 10px;
  color: var(--accent); background: var(--card); font-weight: 600; font-size: 15px; text-decoration: none;
}
.links a:hover { background: var(--memo); }
.links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lnote { font-size: 13px; color: var(--muted); padding-left: 2px; overflow-wrap: anywhere; }

/* Floating input button + light new-entry form */
.fab {
  position: fixed; z-index: 15;

  /* ---------- editor ---------- */
  function fromEntry(e) {

      '<label for="f-checked">확인일<input type="date" id="f-checked" value="' + esc(d.checked) + '"></label>' +

  function parseCodes(text) {
    return lines(text).map(function (l) { return l.split(/[\s,\t:]+/).filter(Boolean); })
      .filter(function (p) { return p.length >= 2; })
      .map(function (p) { return [p[0], p[1]]; });
  }
  function buildEntry(base, v) {
    var n = copyObj(base);
    if (n.id === NEW) n.id = "e-" + Date.now().toString(36);
    n.cat = CAT_LABEL[v.cat] && v.cat !== "all" ? v.cat : "etc";
    n.status = STATUS[v.status] ? v.status : "done";
    if (v.imp) n.important = true; else delete n.important;
    n.symptom = v.symptom.trim();
    if (v.device.trim()) n.device = v.device.trim(); else delete n.device;
    n.prep = lines(v.prep);
    n.steps = lines(v.steps);
    n.memo = lines(v.memo);
    if (base.codes && base.codes.length) {
      var codes = parseCodes(v.codes);
      if (codes.length) n.codes = codes; else delete n.codes;
    }
    // 표 내용은 "수정" 폼이 아니라 "표 고치기"로만 바꾼다 (base.table 그대로 둔다).
    delete n.secret;
    var secs = lines(v.secrets).map(function (l) {
      var i = l.indexOf("|");
      return i < 0 ? { label: l, value: "" } : { label: l.slice(0, i).trim(), value: l.slice(i + 1).trim() };
    }).filter(function (s) { return s.label || s.value; });
    if (secs.length) n.secrets = secs; else delete n.secrets;
    var lk = lines(v.links).map(function (l) {
      var p = l.split("|").map(function (x) { return x.trim(); });
      var url = p.filter(function (x) { return /^https?:\/\//i.test(x); })[0] || "";
      var rest = p.filter(function (x) { return x !== url; });
      return { label: rest[0] || url, url: url, note: rest.slice(1).join(" · ") };
    }).filter(function (l) { return l.url; });
    if (lk.length) n.links = lk; else delete n.links;
    if (v.cnum.trim()) n.contact = { who: v.cname.trim(), num: v.cnum.trim(), ext: v.cext.trim() }; else delete n.contact;
    var kw = v.kw.split(/[,，]/).map(function (x) { return x.trim(); }).filter(Boolean);

  /* ---------- saving: regenerate the whole page and publish it ---------- */
  function buildDoc(entries) {
    var css = document.getElementById("css").textContent;
    var app = document.getElementById("app").textContent;
    var json = JSON.stringify(entries, null, 1).replace(/</g, "\\u003c");
    return SKELETON + "\n" + HEAD +
      '<style id="css">' + css + "</style>\n" +
      '<div id="root"></div>\n' +
      '<script type="application/json" id="data">' + json + "</scr" + "ipt>\n" +
      '<script id="app">' + app + "</scr" + "ipt>\n" +
      "</body></html>";
  }
  function persist(next, doneMsg, openAfter) {
    if (state.saving) return;
    if (!ART && !GH_MODE) { toast("이 화면에서는 저장할 수 없습니다."); return; }
    try {
      sessionStorage.setItem(STASH, JSON.stringify({ open: openAfter === undefined ? state.openId : openAfter, cat: state.cat, room: state.room }));
    } catch (e) {}
    state.saving = true;
    toast("저장 중…", true);
    render();
    var pub = ART ? ART.publish(buildDoc(next)) : ghPublish(GH_DATA_PATH, JSON.stringify(next, null, 1));
    pub.then(function () {
      if (ART) {
        toast(doneMsg + " 새 버전을 불러옵니다…", true);
        return;
      }
      ENTRIES = next;
      state.saving = false;
      toast(doneMsg + " GitHub에 저장했습니다.");

      state.saving = false;

      } else if (code === "not_writer" || code === "not_granted" || code === "consent_required" ||
          code === "capability_disabled" || code === "capability_removed" || code === "not_declared") {
        state.canWrite = false; state.editing = null; state.draft = null; state.confirmDel = null;
        toast("이 화면은 보기 전용이라 수정할 수 없습니다.");
      } else if (code === "too_large") {

      } else if (code === "rate_limited") {
        toast("너무 자주 저장했습니다. 잠시 후 다시 저장해 주세요.");
      } else {
        toast("저장하지 못했습니다. 잠시 후 다시 해 보세요.");
      }
      render();
    });
  }

  /* ---------- order ---------- */
  function visibleList(ts) {
    return ENTRIES.filter(function (e) { return matches(e, ts) && (state.cat === "all" || e.cat === state.cat); });
  }
  function orderRow(e, i, n) {
    return '<div class="orow' + (e.important ? " imp" : "") + '" data-id="' + esc(e.id) + '">' +
      '<span class="onum">' + (i + 1) + "</span>" +
      '<span class="otext"><span class="cat" style="--cc: var(--c-' + esc(e.cat) + ')">' + esc(CAT_LABEL[e.cat] || "기타") + "</span>" +
      '<span class="otitle">' + esc(e.symptom) + "</span></span>" +

        '<button type="button" class="act" data-act="up" data-id="' + esc(e.id) + '" aria-label="위로"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
        '<button type="button" class="act" data-act="down" data-id="' + esc(e.id) + '" aria-label="아래로"' + (i === n - 1 ? " disabled" : "") + ">↓</button>" +
      "</span></div>";
  }
  function moveEntry(id, dir) {
    var vis = visibleList(terms());
    var i = -1;
    for (var k = 0; k < vis.length; k++) if (vis[k].id === id) i = k;
    var j = i + dir;
    if (i < 0 || j < 0 || j >= vis.length) return false;
    var slots = vis.map(function (e) { return ENTRIES.indexOf(e); }).sort(function (a, b) { return a - b; });
    var nv = vis.slice(); var t = nv[i]; nv[i] = nv[j]; nv[j] = t;
    var next = ENTRIES.slice();
    slots.forEach(function (s, k2) { next[s] = nv[k2]; });
    ENTRIES = next;
    return true;
  }

  /* ---------- render ---------- */
  function render() {
    if (state.editing && document.getElementById("editor")) state.draft = readForm();
    if (state.tableEdit) readTableDraft();
    var ts = terms();
    var hits = ENTRIES.filter(function (e) { return matches(e, ts); });
    var counts = { all: hits.length };
    CATS.forEach(function (c) { if (c.key !== "all") counts[c.key] = 0; });
    hits.forEach(function (e) { counts[e.cat] = (counts[e.cat] || 0) + 1; });

    chipsEl.innerHTML = CATS.map(function (c) {
      return '<button type="button" class="chip" data-cat="' + c.key + '" aria-pressed="' + (state.cat === c.key) + '">' +
        esc(c.label) + '<span class="n">' + (counts[c.key] || 0) + "</span></button>";
    }).join("");

    var editE = state.editing ? (state.editing === NEW ? blankEntry() : findEntry(state.editing)) : null;
    if (state.editing && !editE) { state.editing = null; state.draft = null; endAtt(true); }
    var openE = state.openId ? findEntry(state.openId) : null;

  }

  function listHTML(ts) {
    var shown = visibleList(ts);

    var line;

        '<button type="button" class="add" data-act="order-cancel">취소</button>';

      }

  /* ---------- list ↔ one entry ---------- */
  function syncHash() {

  /* ---------- events ---------- */
  chipsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip");
    if (!b) return;
    state.cat = b.getAttribute("data-cat");
    if (!state.editing && !state.tableEdit && state.openId) { state.openId = null; state.listY = 0; }
    syncHash();
    render();
  });
  qEl.addEventListener("input", function () {
    state.q = qEl.value;
    if (!state.editing && !state.tableEdit && state.openId) { state.openId = null; state.listY = 0; syncHash(); }
    render();
  });
  clearEl.addEventListener("click", function () { qEl.value = ""; state.q = ""; render(); qEl.focus(); });

  var ghsetEl = document.getElementById("ghset");
  if (ghsetEl) {
    ghsetEl.hidden = !GH_MODE;
    ghsetEl.addEventListener("click", function () {
      var t = promptGhToken(true);
      toast(t ? "토큰이 저장되었습니다." : "토큰 입력이 취소되었습니다.");
    });
  }

  listEl.addEventListener("click", function (ev) {
    var cp = ev.target.closest && ev.target.closest(".copy");
    if (cp) {
      var num = cp.getAttribute("data-copy");
      var box = cp.parentNode.querySelector(".num, .pwval");
      var selectNum = function () {
        try {
          var r = document.createRange(); r.selectNodeContents(box);
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          cp.textContent = "번호 선택됨";
        } catch (e) {}
      };
      try {
        navigator.clipboard.writeText(num).then(function () {
          var was = cp.textContent;
          cp.textContent = "복사됨";
          setTimeout(function () { cp.textContent = was; }, 1600);
        }, selectNum);
      } catch (e) { selectNum(); }
      return;
    }
    var a = ev.target.closest && ev.target.closest("[data-act]");
    if (!a) return;
    ev.preventDefault();
    if (state.saving) return;
    var act = a.getAttribute("data-act"), id = a.getAttribute("data-id");
    if (act === "stats-win") {
      var we = findEntry(id);
      if (we && we.table) openBoardStats(we);
      return;
    }
    if (act === "note-reset") { delete state.notes[id]; delete state.upg[id]; render(); return; }
    if (act === "note-save") {
      var se = findEntry(id);
      if (!se || !se.table) return;
      saveTable(se, pendingTable(se), "고친 내용을 저장했습니다.");
      return;
    }
    if (act === "room") {
      state.room = a.getAttribute("data-name"); state.logDel = null; state.roomEdit = false;
      render();
      var rp = document.getElementById("room-panel");
      if (rp) { try { rp.scrollIntoView({ block: "start", behavior: "smooth" }); } catch (e) { rp.scrollIntoView(); } }
      return;
    }
    if (act === "room-close") { state.room = null; state.logDel = null; state.roomEdit = false; render(); return; }
    if (act === "room-edit") {
      state.roomEdit = true; state.logDel = null; render();
      var rf = document.getElementById("re-1") || document.getElementById("re-0");
      if (rf) { try { rf.focus({ preventScroll: true }); } catch (e) {} }
      return;
    }
    if (act === "room-edit-cancel") { state.roomEdit = false; render(); return; }
    if (act === "log-del") { state.logDel = state.room + "|" + a.getAttribute("data-i"); render(); return; }
    if (act === "log-del-no") { state.logDel = null; render(); return; }
    if (act === "log-del-yes") {
      var le = findEntry(state.openId);
      if (!le || !le.table || !state.room) return;
      var lt = pendingTable(le);
      lt.logs = cloneLogs(lt.logs);
      var li = parseInt(a.getAttribute("data-i"), 10);
      if (lt.logs[state.room]) {
        lt.logs[state.room].splice(li, 1);
        if (!lt.logs[state.room].length) delete lt.logs[state.room];
      }
      state.logDel = null;
      saveTable(le, lt, "기록을 지웠습니다.");
      return;
    }
    if (act === "open") { openEntry(id); return; }
    if (act === "list") { showList(); return; }
    if (act === "go") { if (id) openEntry(id); return; }
    if (act === "pick") {
      var fi = document.getElementById("f-file");
      if (fi) fi.click();
      return;
    }
    if (act === "att-del") {
      var key = a.getAttribute("data-key");
      state.att = (state.att || []).filter(function (x) {
        if (x.key !== key) return true;
        if (x.id) dropAsset(x.id);
        if (x.preview) { try { URL.revokeObjectURL(x.preview); } catch (e) {} }
        return false;
      });
      drawAtt();
      return;
    }
    if (act === "get") {
      var ge = findEntry(a.getAttribute("data-eid"));
      var aid = a.getAttribute("data-aid");
      var at = ge ? (ge.attachments || []).filter(function (x) { return x.id === aid; })[0] : null;
      if (!at || !DL || a.disabled) return;
      a.disabled = true;
      var gwas = a.textContent;
      a.textContent = "준비 중…";
      saveAttachment(at).then(function () {
        toast("‘" + at.name + "’ 파일을 저장했어요");
      }, function (err) {
        var code = err && err.code;
        if (code === "declined") return;
        if (code === "missing") toast("파일을 찾을 수 없어요. 수정에서 다시 첨부해 주세요");
        else if (code === "rate_limited") toast("저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요");
        else if (code === "rejected_extension" || code === "extension_not_enabled") toast("이 화면에서는 이 형식의 파일을 받을 수 없어요");
        else if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
          toast("이 화면에서는 파일 저장을 할 수 없어요");
          DL = null; state.canDownload = false;
        } else toast("파일을 받지 못했어요. 잠시 뒤 다시 눌러 주세요");
      }).then(function () {
        a.disabled = false; a.textContent = gwas;
        if (!state.canDownload) render();
      });
      return;
    }
    if (act === "xlsx") {
      var xe = findEntry(id);
      if (!xe || !xe.table || !DL || a.disabled) return;
      a.disabled = true;
      var wasTxt = a.textContent;
      a.textContent = "만드는 중…";
      exportTable(xe).then(function () {
        toast("엑셀 파일을 저장했어요");
      }, function (err) {
        var code = err && err.code;
        if (code === "declined") return;
        if (code === "rate_limited") toast("저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요");
        else if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
          toast("이 화면에서는 파일 저장을 할 수 없어요");
          DL = null; state.canDownload = false;
        } else toast("엑셀 파일을 만들지 못했어요. 잠시 뒤 다시 눌러 주세요");
      }).then(function () {
        a.disabled = false; a.textContent = wasTxt;
        if (!state.canDownload) render();
      });
      return;
    }
    if (act === "tedit") {
      var te = findEntry(id);
      if (!te || !te.table) return;
      state.tableEdit = id; state.editing = null; state.draft = null; state.confirmDel = null;
      var tnc = (te.table.cols || []).indexOf("비고");
      state.tableDraft = (te.table.rows || []).map(function (r, ri) {
        var c = r.slice(), nv = noteVal(id, ri);
        if (nv !== undefined && tnc > -1) { while (c.length <= tnc) c.push(""); c[tnc] = nv; }
        return c;
      });
      delete state.notes[id];
      state.tableKeys = state.tableDraft.map(function (r) { return cellv(r, 0); });
      state.room = null;
      render();
      return;
    } else if (act === "tcancel") {
      state.tableEdit = null; state.tableDraft = null; state.tableKeys = null; render();
      return;
    } else if (act === "trow-add") {
      readTableDraft();
      var tn = tableCols(findEntry(id)) || 1;
      var blank = []; for (var bi = 0; bi < tn; bi++) blank.push("");
      state.tableDraft.push(blank);
      if (state.tableKeys) state.tableKeys.push("");
      render();
      var nf = document.getElementById("t-" + (state.tableDraft.length - 1) + "-0"); if (nf) nf.focus();
      return;
    } else if (act === "trow-del") {
      readTableDraft();
      var delRow = parseInt(a.getAttribute("data-row"), 10);
      state.tableDraft.splice(delRow, 1);
      if (state.tableKeys) state.tableKeys.splice(delRow, 1);
      render();
      return;
    } else if (act === "tsave") {
      readTableDraft();
      var tb = findEntry(id);
      if (!tb) return;
      var keys = state.tableKeys || [];
      var pairs = state.tableDraft.map(function (r, ri) { return [r.map(function (c) { return String(c || "").trim(); }), keys[ri] || ""]; })
        .filter(function (p) { return p[0].some(function (c) { return c; }); });
      var tt = pendingTable(tb);
      tt.rows = pairs.map(function (p) { return p[0]; });
      if (tt.logs) {
        // 교실 이름을 바꿨으면 그 교실 기록도 새 이름으로 옮긴다
        tt.logs = cloneLogs(tt.logs);
        pairs.forEach(function (p) {
          var old = p[1], nw = cellv(p[0], 0);
          if (old && nw && old !== nw && tt.logs[old] && !tt.logs[nw]) { tt.logs[nw] = tt.logs[old]; delete tt.logs[old]; }
        });
      }
      saveTable(tb, tt, "표를 저장했습니다.");
      return;
    }
    if (act === "order" || act === "edit" || act === "new") { state.tableEdit = null; state.tableDraft = null; }
    if (act === "order") {
      state.reorder = true; state.snapshot = ENTRIES.slice(); state.editing = null; state.draft = null; state.confirmDel = null;
      render();
      return;
    } else if (act === "order-cancel") {
      if (state.snapshot) ENTRIES = state.snapshot;
      state.reorder = false; state.snapshot = null; render();
      return;
    } else if (act === "order-save") {
      persist(ENTRIES.slice(), "순서를 저장했습니다.");
      return;
    } else if (act === "up" || act === "down") {
      if (moveEntry(id, act === "up" ? -1 : 1)) {
        render();
        var row = listEl.querySelector('.orow[data-id="' + id + '"]');
        if (row) {
          var b2 = row.querySelector('[data-act="' + act + '"]');
          if (!b2 || b2.disabled) b2 = row.querySelector('[data-act="' + (act === "up" ? "down" : "up") + '"]');
          if (b2) b2.focus();
        }
      }
      return;
    }
    if (act === "edit") {
      state.editing = id; state.draft = null; state.confirmDel = null; startAtt(findEntry(id)); render();
      toMainTop();
    } else if (act === "new") {
      state.editing = NEW; state.draft = null; state.confirmDel = null; startAtt(null); render();
      toMainTop();
      var f2 = document.getElementById("f-symptom"); if (f2) { try { f2.focus({ preventScroll: true }); } catch (e) {} }
    } else if (act === "cancel") {
      state.editing = null; state.draft = null; endAtt(true); render();
      toMainTop();
    } else if (act === "del") {
      state.confirmDel = id; render();
    } else if (act === "del-no") {
      state.confirmDel = null; render();
    } else if (act === "del-yes") {
      var gone = findEntry(id);
      persist(ENTRIES.filter(function (e) { return e.id !== id; }), "‘" + (gone ? gone.symptom : "항목") + "’을(를) 삭제했습니다.", null);
    }
  });

  fabEl.addEventListener("click", function () {
    if (state.saving) return;
    state.editing = NEW; state.draft = null; state.confirmDel = null; state.reorder = false;
    state.tableEdit = null; state.tableDraft = null;
    startAtt(null);
    render();
    toMainTop();
    var f = document.getElementById("f-symptom"); if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} }
  });

  listEl.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (!f || f.id !== "editor" || state.saving) return;
    var v = readForm();
    var err = document.getElementById("f-err");
    var att = state.att || [];
    var busy = att.some(function (x) { return x.st === "up"; });
    var okAtt = att.some(function (x) { return x.st === "ok" && x.id; });
    var problem = !v.symptom.trim() ? "제목을 적어 주세요."
      : busy ? "파일을 올리는 중이에요. 다 올라간 뒤 저장해 주세요."
      : (!lines(v.steps).length && !okAtt && !lines(v.memo).length && !(state.editing !== NEW && (findEntry(state.editing) || {}).table))
        ? "내용을 한 줄 이상 적거나 파일을 첨부해 주세요." : "";
    if (problem) { err.textContent = problem; err.hidden = false; return; }
    var isNew = state.editing === NEW;
    var base = isNew ? blankEntry() : findEntry(state.editing);
    if (!base) { state.editing = null; render(); return; }
    var n = buildEntry(base, v);
    var next = isNew ? [n].concat(ENTRIES) : ENTRIES.map(function (e) { return e.id === base.id ? n : e; });
    if (!isNew && n.important && !base.important) next = [n].concat(ENTRIES.filter(function (e) { return e.id !== base.id; }));
    state.draft = v;
    persist(next, isNew ? "새 항목을 추가했습니다." : "수정했습니다.", n.id);
  });

  // 사진이 지워졌거나 못 불러오면 안내 문구로 바꾼다
  listEl.addEventListener("error", function (ev) {
    var t = ev.target;
    if (!t || t.tagName !== "IMG" || !t.closest || !t.closest(".shot")) return;
    var p = document.createElement("p");
    p.className = "none";
    p.textContent = "사진을 불러오지 못했습니다.";
    t.replaceWith(p);
  }, true);

  // 캡처한 그림 붙여 넣기 (입력 화면에서). 엑셀 칸을 복사해 글 칸에 붙일 때는 글자로 붙인다.
  document.addEventListener("paste", function (ev) {
    if (!state.editing || !state.att || !document.getElementById("editor")) return;
    var cd = ev.clipboardData;
    if (!cd) return;
    var files = [];
    try {
      Array.prototype.forEach.call(cd.items || [], function (it) {
        if (it.kind === "file") { var f = it.getAsFile(); if (f) files.push(f); }
      });
    } catch (e) {}
    if (!files.length && cd.files && cd.files.length) files = Array.prototype.slice.call(cd.files);
    if (!files.length) return;
    var t = ev.target && ev.target.closest ? ev.target : null;
    var inZone = t && t.closest("#f-drop");
    var inText = t && t.closest("textarea, input");
    var types = Array.prototype.slice.call(cd.types || []);
    if (inText && !inZone && types.indexOf("text/plain") > -1) return;
    ev.preventDefault();
    if (!ASSETS) { toast("이 화면에서는 파일을 올릴 수 없어요."); return; }
    toast(files.length > 1 ? "붙여 넣은 파일 " + files.length + "개를 올립니다" : "붙여 넣은 그림을 올립니다");
    addFiles(files, true);
  });

  // 파일 끌어다 놓기 (입력 화면 아무 곳에나)
  function dragFiles(ev) { var d = ev.dataTransfer; return !!d && Array.prototype.indexOf.call(d.types || [], "Files") > -1; }
  document.addEventListener("dragover", function (ev) {
    if (!state.editing || !dragFiles(ev)) return;
    ev.preventDefault();
    var z = document.getElementById("f-drop");
    if (z) z.classList.add("over");
  });
  document.addEventListener("dragleave", function (ev) {
    var z = document.getElementById("f-drop");
    if (z && (ev.target === document.documentElement || ev.target === document.body || !ev.relatedTarget)) z.classList.remove("over");
  });
  document.addEventListener("drop", function (ev) {
    if (!state.editing || !dragFiles(ev)) return;
    ev.preventDefault();
    var z = document.getElementById("f-drop");
    if (z) z.classList.remove("over");
    addFiles(ev.dataTransfer.files, false);
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t || t.id !== "f-file") return;
    addFiles(t.files, false);
    try { t.value = ""; } catch (e) {}
  });

  // 비고 칸 바로 고치기: 입력할 때마다 표시만 바꾸고, 저장은 [비고 저장]으로 한 번에
  listEl.addEventListener("input", function (ev) {
    var t = ev.target;
    // 표 고치기 중: 통계를 바로 다시 계산
    if (t && t.closest && t.closest(".tedit") && state.tableEdit) {
      readTableDraft();
      var te2 = findEntry(state.tableEdit);
      var sEl = te2 && isBoard(te2.table) ? document.getElementById("stats-" + te2.id) : null;
      if (sEl) sEl.outerHTML = statsHTML(te2, state.tableDraft, true);
      return;
    }
    if (!t || !t.classList || !t.classList.contains("note-in")) return;
    var eid = t.getAttribute("data-eid"), ri = parseInt(t.getAttribute("data-row"), 10);
    var ne = findEntry(eid);
    if (!ne || !ne.table) return;
    var nc = (ne.table.cols || []).indexOf("비고");
    var row = (ne.table.rows || [])[ri] || [];
    var orig = row[nc] == null ? "" : String(row[nc]);
    var m = state.notes[eid] || (state.notes[eid] = {});
    if (t.value === orig) delete m[ri]; else m[ri] = t.value;
    if (!Object.keys(m).length) delete state.notes[eid];
    t.classList.toggle("dirty", t.value !== orig);
    var bar = document.getElementById("nbar-" + eid);
    if (bar) bar.innerHTML = nbarHTML(ne);
  });
  // 업그레이드 가능(가/부) 고르기
  listEl.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t || !t.classList || !t.classList.contains("upg")) return;
    var eid = t.getAttribute("data-eid"), k = t.getAttribute("data-key");
    var ue = findEntry(eid);
    if (!ue) return;
    var m = state.upg[eid] || (state.upg[eid] = {});
    if (t.value === upSaved(ue, k)) delete m[k]; else m[k] = t.value;
    if (!Object.keys(m).length) delete state.upg[eid];
    t.classList.toggle("dirty", t.value !== upSaved(ue, k));
    var bar = document.getElementById("nbar-" + eid);
    if (bar) bar.innerHTML = nbarHTML(ue);
  });
  // 교실(반) 한 줄 정보 저장 (이름을 바꾸면 기록도 따라간다)
  listEl.addEventListener("submit", function (ev) {
    var f = ev.target;
    if (!f || f.id !== "roomform") return;
    ev.preventDefault();
    if (state.saving) return;
    var re = findEntry(state.openId);
    if (!re || !re.table || !state.room) return;
    var tt = pendingTable(re), rcols = tt.cols || [];
    var ri = -1;
    tt.rows.forEach(function (r, i) { if (ri < 0 && cellv(r, 0) === state.room) ri = i; });
    if (ri < 0) return;
    var vals = rcols.map(function (_, j) {
      var el = document.getElementById("re-" + j);
      return el ? String(el.value || "").trim() : cellv(tt.rows[ri], j);
    });
    var nn = vals[0];
    var dup = nn !== state.room && tt.rows.some(function (r, i) { return i !== ri && cellv(r, 0) === nn; });
    if (!nn || dup) {
      var er = document.getElementById("re-err");
      if (er) { er.textContent = !nn ? "이름을 적어 주세요." : "‘" + nn + "’이(가) 이미 있어요."; er.hidden = false; }
      return;
    }
    var nrow = tt.rows[ri].slice();
    vals.forEach(function (v, j) { nrow[j] = v; });
    tt.rows[ri] = nrow;
    if (nn !== state.room && tt.logs && tt.logs[state.room]) {
      tt.logs = cloneLogs(tt.logs);
      tt.logs[nn] = tt.logs[state.room];
      delete tt.logs[state.room];
    }
    if (state.notes[re.id]) { delete state.notes[re.id][ri]; if (!Object.keys(state.notes[re.id]).length) delete state.notes[re.id]; }
    state.room = nn; state.roomEdit = false;
    saveTable(re, tt, "‘" + nn + "’ 정보를 저장했습니다.");
  });
  // 교실 기록 남기기
  listEl.addEventListener("submit", function (ev) {
    var f = ev.target;
    if (!f || f.id !== "logform") return;
    ev.preventDefault();
    if (state.saving) return;
    var le = findEntry(state.openId);
    if (!le || !le.table || !state.room) return;
    var d = (document.getElementById("lg-d") || {}).value || "";
    var k = (document.getElementById("lg-k") || {}).value || "기타";
    var tx = String((document.getElementById("lg-t") || {}).value || "").trim();
    if (!tx) {
      var er = document.getElementById("lg-err");
      if (er) { er.textContent = "내용을 적어 주세요."; er.hidden = false; }
      return;
    }
    var t2 = pendingTable(le);
    t2.logs = cloneLogs(t2.logs);
    (t2.logs[state.room] = t2.logs[state.room] || []).push({ d: /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : today(), k: k, t: tx });
    saveTable(le, t2, "‘" + state.room + "’ 기록을 남겼습니다.");
  });
  // 표 고치기: 엑셀처럼 Enter·↑↓로 위아래 칸 이동 (Tab은 옆 칸)
  listEl.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (!t || !t.closest || !t.closest(".tedit") || ev.isComposing || ev.keyCode === 229) return;
    var m = /^t-(\d+)-(\d+)$/.exec(t.id || "");
    if (!m) return;
    var dr = 0;
    if (ev.key === "Enter") dr = ev.shiftKey ? -1 : 1;
    else if (ev.key === "ArrowDown") dr = 1;
    else if (ev.key === "ArrowUp") dr = -1;
    if (!dr) return;
    ev.preventDefault();
    var nx = document.getElementById("t-" + (parseInt(m[1], 10) + dr) + "-" + m[2]);
    if (nx) { nx.focus(); try { nx.select(); } catch (e) {} }
  });
  listEl.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (!t || !t.classList || !t.classList.contains("note-in") || ev.isComposing || ev.keyCode === 229) return;
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    var nx = document.getElementById("n-" + t.getAttribute("data-eid") + "-" + (parseInt(t.getAttribute("data-row"), 10) + (ev.shiftKey ? -1 : 1)));
    if (nx) { nx.focus(); try { nx.select(); } catch (e) {} } else t.blur();
  });

  // Esc 키로 목록으로
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape" || !state.openId || state.editing || state.tableEdit || state.saving) return;
    var t = ev.target;
    if (t && t.closest && t.closest("input, textarea, select")) return;
    if (state.room) { state.room = null; state.logDel = null; state.roomEdit = false; render(); return; }
    showList();
  });

  // 매뉴얼 내용(데이터)은 따로 떨어진 data.json에서 불러온다 (claude.ai 아티팩트에서 저장했을 때처럼
  // 데이터가 이 페이지 안에 그대로 박혀 있는 경우는 그걸 그대로 쓴다)
  var dataEl = document.getElementById("data");
  var entriesLoad = dataEl
    ? Promise.resolve().then(function () { return JSON.parse(dataEl.textContent) || []; })
    : fetch("data.json").then(function (r) { return r.json(); });
  entriesLoad.catch(function () { return []; }).then(function (data) {
    ENTRIES = data || [];
    // 주소 끝 #분류 또는 #글아이디 로 바로 열기
    try {
      var h = (location.hash || "").replace("#", "");
      if (CAT_LABEL[h]) state.cat = h;
      else if (h && findEntry(h)) state.openId = h;
    } catch (e) {}
    // 저장한 뒤 새 버전이 열리면, 보고 있던 글로 돌아가기
    try {
      var st = JSON.parse(sessionStorage.getItem(STASH) || "null");
      sessionStorage.removeItem(STASH);
      if (st) {
        if (st.cat && CAT_LABEL[st.cat]) state.cat = st.cat;
        state.openId = st.open && findEntry(st.open) ? st.open : null;
        state.room = state.openId && st.room ? st.room : null;
      }
    } catch (e) {}
    render();
    stats();
    if (state.room) {
      var rp0 = document.getElementById("room-panel");
      if (rp0) { try { rp0.scrollIntoView({ block: "start" }); } catch (e) {} }
    }
  });

  /* ---------- write access (only for people who can edit this page) ---------- */
  try {
    if (window.claude && typeof window.claude.use === "function") {
      Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (r) {
        ART = r[0];
        if (!ART) return;
        var u = r[1];
        return (u ? u.canEdit() : Promise.resolve(true)).then(function (ok) {
          state.canWrite = !!ok;
          if (state.canWrite) render();
        });
      }).catch(function () {});
      window.claude.use("downloads").then(function (d) {
        DL = d || null;
        state.canDownload = !!DL;
        if (DL) render();
      }).catch(function () {});
      window.claude.use("assets").then(function (x) {
        ASSETS = x || null;
        if (ASSETS && state.editing) render();
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
</body></html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기전판서앱 다운로드</title>
<style>
  :root{
    --ink:#141d26;--ink-2:#1e2b38;--ink-3:#2b3b4c;--slate:#33475b;
    --chalk:#f5d547;--line:#3d5165;--text:#e8eef4;--text-dim:#8fa3b5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ink);color:var(--text);
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 16px 60px;
  }

  /* ---- 실제 앱 '서재' 화면을 그대로 옮긴 미리보기(데모 화면, 실제 자료 아님) ---- */
  .preview{
    width:100%;max-width:860px;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.45);
    background:var(--ink);
  }
  .bar{height:52px;background:var(--ink);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:0 16px}
  .bar .dot{width:10px;height:10px;border-radius:2px;background:var(--chalk);
    box-shadow:0 0 0 3px rgba(245,213,71,.18)}
  .bar b{font-size:14px;font-weight:700}
  .bar span{font-size:12px;color:var(--text-dim)}

  .lib{padding:36px 28px 30px;text-align:center}
  .lib h1{margin:0 0 20px;font-size:26px;font-weight:800;letter-spacing:-.3px}
  .tabs{display:inline-flex;gap:6px;background:var(--ink-2);border:1px solid var(--line);
    border-radius:10px;padding:4px;margin-bottom:28px}
  .tabs span{padding:7px 14px;border-radius:7px;font-size:13px;color:var(--text-dim)}
  .tabs span.on{background:var(--ink-3);color:var(--chalk);font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 22px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,140px);justify-content:center}}
  .addcard{border:2px dashed var(--line);border-radius:12px;height:120px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    color:var(--text-dim);font-size:12.5px;padding:0 6px;text-align:center}
  .addcard .ic{font-size:24px;color:var(--chalk);font-weight:800}
  .addcard .badge{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-size:14px;font-weight:800}
  .addcard .badge.chrome{background:#fff;color:#4285f4}
  .addcard .badge.naver{background:#03c75a;color:#fff}
  .addcard .badge.youtube{background:#ff0033;color:#fff}

  .thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;
    max-width:620px;margin:0 auto}
  .thumb{aspect-ratio:3/4;border-radius:10px;background:var(--ink-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .thumb i{font-size:28px;opacity:.55}
  .thumb.c1{background:linear-gradient(160deg,#2b3b4c,#1e2b38)}
  .thumb.c2{background:linear-gradient(160deg,#3a3320,#2b3b4c)}
  .thumb.c3{background:linear-gradient(160deg,#20362b,#1e2b38)}
  .thumb.c4{background:linear-gradient(160deg,#352030,#1e2b38)}

  /* ---- 다운로드 영역 ---- */
  .promo{width:100%;max-width:860px;text-align:center;margin-top:34px}
  .promo h2{font-size:22px;font-weight:800;margin:0 0 8px;letter-spacing:-.2px}
  .promo p{font-size:14.5px;color:var(--text-dim);margin:0 0 26px;line-height:1.6}
  .dl-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:16px 34px;border-radius:14px;
    background:var(--chalk);color:#1a1a12;
    font-size:17px;font-weight:800;text-decoration:none;letter-spacing:.2px;
    box-shadow:0 14px 34px rgba(245,213,71,.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .dl-btn:hover{transform:translateY(-1px);box-shadow:0 18px 40px rgba(245,213,71,.35)}
  .dl-btn:active{transform:translateY(0)}
  .meta{margin-top:16px;font-size:12.5px;color:var(--text-dim)}
  .meta a{color:var(--text-dim);text-decoration:underline}

  .tip{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;
    background:var(--ink-2);border:1px solid var(--line);font-size:13.5px;color:var(--text-dim);
    margin-bottom:18px;max-width:860px;text-align:center}
  .tip b{color:var(--chalk);font-weight:700}
</style>
</head>
<body>

  <div class="tip">💡 <b>한글·파워포인트·엑셀·PDF</b> 파일을 그대로 불러와 판서하고, <b>크롬</b>으로 인터넷도 겹쳐 쓸 수 있어요</div>

  <div class="preview" aria-hidden="true">
    <div class="bar">
      <div class="dot"></div>
      <b>판서노트</b>
      <span>파일 없음</span>
    </div>
    <div class="lib">
      <h1>서재</h1>
      <div class="tabs">
        <span class="on">최근순</span><span>이름순</span><span>폴더별</span>
      </div>
      <div class="grid">
        <div class="addcard"><div class="ic">＋</div>PDF·그림 선택</div>
        <div class="addcard"><div class="ic">📊</div>파워포인트·한글·엑셀 열기</div>
        <div class="addcard"><div class="ic">▥</div>칠판만 쓰기</div>
        <div class="addcard"><div class="badge chrome">C</div>크롬 열기</div>
        <div class="addcard"><div class="badge naver">N</div>네이버 열기</div>
        <div class="addcard"><div class="badge youtube">▶</div>유튜브 열기</div>
      </div>
      <div class="thumbs">
        <div class="thumb c1"><i>📄</i></div>
        <div class="thumb c2"><i>📊</i></div>
        <div class="thumb c3"><i>📝</i></div>
        <div class="thumb c4"><i>📈</i></div>
      </div>
    </div>
  </div>

  <div class="promo">
    <h2>기전판서앱</h2>
    <p>판서노트 + 파워포인트·한글·엑셀 불러오기<br>Windows 데스크톱 전자칠판 프로그램</p>
    <a class="dl-btn" href="https://github.com/jinheewhite/noteall/releases/latest/download/noteall-Setup.exe">
      ⬇ 다운로드 (Windows)
    </a>
    <div class="meta">설치 후 자동으로 업데이트됩니다</div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>botem.com</title>
<script>
  // 대소문자·공백이 달라도 앱으로 바로 연결 (예: /Kijun, /KIJUN/, /NoteAll)
  (function () {
    var p = decodeURIComponent(location.pathname).trim().toLowerCase().replace(/\s+/g, "");
    var m = p.match(/^\/(kijun|noteall|note)(\/.*)?$/);
    if (m) location.replace("/" + m[1] + "/" + location.search + location.hash);
  })();
</script>
<style>
  html,body{height:100%;margin:0}
  body{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    background:#0f1424;
    color:#eef1f8;
  }
  /* 은은하게 움직이는 배경 빛 — 두 개의 흐린 광원이 천천히 떠다닙니다 */
  .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
  .glow.a{width:520px;height:520px;background:#5b6bf5;top:-160px;left:-120px;
    animation:float1 16s ease-in-out infinite}
  .glow.b{width:420px;height:420px;background:#8b5cf6;bottom:-140px;right:-100px;
    animation:float2 18s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-40px)}}

  .card{position:relative;z-index:1;text-align:center;padding:52px 44px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:28px;backdrop-filter:blur(18px);
    box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .icon-wrap{width:104px;height:104px;margin:0 auto 30px;position:relative}
  .icon-ring{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle,rgba(123,139,255,.35),transparent 70%)}
  .icon{width:104px;height:104px;position:relative;animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:26px;font-weight:700;margin:0 0 10px;letter-spacing:-.3px}
  p{font-size:15px;color:rgba(238,241,248,.6);margin:0;letter-spacing:.2px}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:22px}
  .dots span{width:6px;height:6px;border-radius:50%;background:#7b8bff;opacity:.35;
    animation:blink 1.4s ease-in-out infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="card">
    <div class="icon-wrap">
      <div class="icon-ring"></div>
      <svg class="icon" viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(52 52)">
          <path d="M0 -40
            a40 40 0 0 1 34.6 20
            l-9.2 5.3
            a29.6 29.6 0 0 0 -25.4 -14.7 Z" fill="#7b8bff"/>
          <path d="M34.6 -20
            a40 40 0 0 1 0 40
            l-9.2 -5.3
            a29.6 29.6 0 0 0 0 -29.4 Z" fill="#8b5cf6"/>
          <path d="M34.6 20
            a40 40 0 0 1 -34.6 20
            v-10.6
            a29.6 29.6 0 0 0 25.4 -14.7 Z" fill="#a78bfa"/>
          <path d="M0 40
            a40 40 0 0 1 -34.6 -20
            l9.2 -5.3
            a29.6 29.6 0 0 0 25.4 14.7 Z" fill="#c4b5fd"/>
          <path d="M-34.6 20
            a40 40 0 0 1 0 -40
            l9.2 5.3
            a29.6 29.6 0 0 0 0 29.4 Z" fill="#ddd6fe"/>
          <path d="M-34.6 -20
            a40 40 0 0 1 34.6 -20
            v10.6
            a29.6 29.6 0 0 0 -25.4 14.7 Z" fill="#ede9fe"/>
          <circle r="15" fill="#0f1424"/>
          <circle r="15" fill="none" stroke="#7b8bff" stroke-width="2" opacity=".6"/>
        </g>
      </svg>
    </div>
    <h1>점검중입니다</h1>
    <p>더 나은 모습으로 곧 찾아뵙겠습니다.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
